  <g id="semantic-validation-task" data-pptx-bounds="56 302 352 244">
    <text x="56" y="359" font-size="64" font-weight="bold" fill="#237F89">01</text>
    <text x="56" y="408" font-size="28" font-weight="bold" fill="#17324D">语义与依赖审校</text>
    <text x="56" y="457" fill="#243748">审校 query 条件与依赖。<tspan x="56" dy="36">独立覆盖报警、支持、</tspan><tspan x="56" dy="36">不足和无效四类输出。</tspan></text>
  </g>
  <g id="evidence-validation-task" data-pptx-bounds="464 302 352 244">
    <text x="464" y="359" font-size="64" font-weight="bold" fill="#237F89">02</text>
    <text x="464" y="408" font-size="28" font-weight="bold" fill="#17324D">等量补证对照</text>
    <text x="464" y="457" fill="#243748">旧帧 / 等量均匀新帧 /<tspan x="464" dy="36">等量定向新帧。</tspan><tspan x="464" dy="36">固定模型和核验问题。</tspan></text>
  </g>
  <g id="boundary-validation-task" data-pptx-bounds="872 302 352 244">
