    <text x="872" y="408" font-size="28" font-weight="bold" fill="#17324D">时间边界验证</text>
    <text x="872" y="457" fill="#243748">单独检查时间覆盖。<tspan x="872" dy="36">如改写区间，再报告</tspan><tspan x="872" dy="36">R1 与 MR mAP。</tspan></text>
