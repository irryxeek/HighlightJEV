  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="title" data-pptx-bounds="56 42 1168 122"><text x="56" y="65" font-size="20" fill="#237F89">11 / 下一步验证</text><text x="56" y="127" font-size="42" font-weight="bold" fill="#17324D">下一步要证明：能发现什么错，怎样补证</text></g>
  <g id="runtime-prerequisite" data-pptx-bounds="56 194 1168 82">
    <rect x="56" y="194" width="1168" height="82" fill="#F2F5F8"/>
